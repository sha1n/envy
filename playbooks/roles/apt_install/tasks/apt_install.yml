---
- name: Install apt package
  ansible.builtin.apt:
    pkg:
      - "{{ item }}"
    update_cache: true
    state: present
  become: true
  loop: "{{ apt_packages | mandatory }}"
  tags:
    - always

- name: Remove dependencies that are no longer required
  ansible.builtin.apt:
    autoremove: true
  become: true
  tags:
    - always
