---
- name: Include install_git_darwin.yml tasks
  ansible.builtin.include_tasks: install_git_darwin.yml
  when: ansible_facts['os_family'] == "Darwin"
  tags:
    - git

- name: Include install_git_ubuntu.yml tasks
  ansible.builtin.include_tasks: install_git_ubuntu.yml
  when:
    - ansible_facts['machine'] == "x86_64"
    - ansible_facts['distribution'] == "Debian" or ansible_facts['distribution'] == "Ubuntu"
  tags:
    - git
    - apt

- name: Install GitHub and GitLab clients
  ansible.builtin.include_role:
    name: brew
    tasks_from: install_formula.yml
  vars:
    brew_formulas:
      - gh
      - glab
  tags:
    - git
    - gh
    - glab

- name: Check if .gitignore_global exists
  ansible.builtin.stat:
    path: '{{ ansible_facts["env"]["HOME"] }}/.gitignore_global'
  register: git_gitignore_global
  tags:
    - git

- name: Create .gitignore_global file
  ansible.builtin.copy:
    src: .gitignore_global
    dest: '{{ ansible_facts["env"]["HOME"] }}/.gitignore_global'
    mode: "0644"
  when: not git_gitignore_global.stat.exists
  tags:
    - git

- name: Check if .gitconfig exists
  ansible.builtin.stat:
    path: '{{ ansible_facts["env"]["HOME"] }}/.gitconfig'
  register: git_gitconfig
  tags:
    - git

- name: Configure git and create .gitconfig
  ansible.builtin.template:
    src: .gitconfig.j2
    dest: '{{ ansible_facts["env"]["HOME"] }}/.gitconfig'
    mode: "0644"
  when: not git_gitconfig.stat.exists
  tags:
    - git
