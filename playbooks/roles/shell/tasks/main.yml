---
- name: Create ~/.local/bin directory
  ansible.builtin.file:
    path: '{{ ansible_facts["env"]["HOME"] }}/.local/bin'
    state: directory
    mode: "0755"
  tags:
    - zsh

- name: Include Zsh tasks
  ansible.builtin.include_tasks: zsh.yml
  when:
    - ansible_facts['machine'] == "x86_64"
    - ansible_facts['distribution'] == "Debian" or ansible_facts['distribution'] == "Ubuntu"
  tags:
    - zsh

- name: Include Powerline tasks
  ansible.builtin.include_tasks: powerline.yml
  tags:
    - powerline-fonts
    - zsh

- name: Include Profile tasks
  ansible.builtin.include_tasks: profile.yml
  tags:
    - zsh

- name: Include Vim tasks
  ansible.builtin.include_tasks: vim.yml
  tags:
    - vim

- name: Include Nvim tasks
  ansible.builtin.include_tasks: nvim.yml
  tags:
    - nvim

- name: Include Fzf tasks
  ansible.builtin.include_tasks: fzf.yml
  tags:
    - fzf
